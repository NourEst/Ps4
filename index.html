<!DOCTYPE html>
<html manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Wobkot Auto Jailbreak</title>
    <style>
        body { background: #0b0d10; color: #c8ced8; font-family: sans-serif; text-align: center; padding-top: 50px; }
        h1 { color: #fff; }
        #btn { display: none; width: 80%; max-width: 400px; padding: 25px; background: #2ea043; color: white; font-size: 24px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        #status { margin-top: 20px; font-size: 14px; color: #7fd0a0; }
    </style>
</head>
<body>
    <h1>WOBKOT JAILBREAK</h1>
    <div id="status">Checking cache...</div>
    
    <button id="btn" onclick="runExploit()">RUN JAILBREAK</button>

    <script>
        // --- 1. ERROR CATCHER ---
        // If main.js crashes or is missing, this will show the error on screen
        window.onerror = function(msg, url, line) {
            var s = document.getElementById('status');
            s.innerHTML = "<span style='color:red;'>ERROR: " + msg + "<br>File: " + url + "<br>Line: " + line + "</span>";
            document.getElementById('btn').style.display = "block"; // Show button again
            return false;
        };

        var statusEl = document.getElementById('status');
        var btnEl = document.getElementById('btn');

        // --- 2. RUN EXPLOIT ---
        function runExploit() {
            btnEl.style.display = "none";
            statusEl.innerHTML = "<b>Running Exploit... Do not close the browser.</b>";
            statusEl.style.color = "#d8c07f";
            
            // Tell Wobkot where its files are
            window.wobkot_source = "src/";

            // Load main.js directly (no iframe)
            var script = document.createElement("script");
            script.src = "src/main.js";
            document.body.appendChild(script);
        }

        // --- 3. CACHE LOGIC ---
        var appCache = window.applicationCache;
        if (!appCache || !document.documentElement.hasAttribute("manifest")) {
            statusEl.textContent = "Cache bypassed. Ready.";
            btnEl.style.display = "block";
        } else if (!navigator.onLine) {
            statusEl.textContent = "Loaded from offline cache.";
            btnEl.style.display = "block";
        } else if (appCache.status === appCache.IDLE || appCache.status === appCache.UPDATEREADY) {
            statusEl.textContent = "Cached and ready.";
            btnEl.style.display = "block";
        } else {
            statusEl.textContent = "Caching files for offline (first run)...";
            appCache.addEventListener('progress', function(e) {
                if (e.total) statusEl.textContent = "Caching: " + Math.round((e.loaded / e.total) * 100) + "%";
            });
            appCache.addEventListener('cached', function() {
                statusEl.textContent = "Cached successfully! You can go offline now.";
                btnEl.style.display = "block";
            });
        }
    </script>
</body>
</html>
